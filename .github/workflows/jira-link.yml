name: Jira link

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Find Jira issue key
        id: jira
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          key=$(echo "$BRANCH $TITLE" | grep -oE '[A-Z]+-[0-9]+' | head -n 1 || true)
          if [ -z "$key" ]; then
            echo "No Jira issue key found in branch name or PR title, skipping."
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Comment with Jira link
        if: steps.jira.outputs.key != ''
        uses: actions/github-script@v7
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          ISSUE_KEY: ${{ steps.jira.outputs.key }}
        with:
          script: |
            const { JIRA_BASE_URL, ISSUE_KEY } = process.env;
            if (!JIRA_BASE_URL) {
              core.warning("JIRA_BASE_URL repository variable is not set; skipping comment.");
              return;
            }
            const url = `${JIRA_BASE_URL.replace(/\/$/, "")}/browse/${ISSUE_KEY}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Jira issue: [${ISSUE_KEY}](${url})`,
            });
